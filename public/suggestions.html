<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalShare - Suggestions</title>
  <meta name="description" content="Have an idea to improve LocalShare? Submit your suggestions and feedback directly to the team.">
  <meta name="keywords" content="file sharing, local network, LocalShare, secure file transfer">
  <link rel="canonical" href="https://www.local-share.com/suggestions.html">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.local-share.com/suggestions.html">
  <meta property="og:site_name" content="LocalShare">
  <meta property="og:title" content="LocalShare Suggestions">
  <meta property="og:description" content="Have an idea to improve LocalShare? Submit your suggestions and feedback directly to the team.">
  <meta property="og:image" content="https://www.local-share.com/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LocalShare Suggestions">
  <meta name="twitter:description" content="Have an idea to improve LocalShare? Submit your suggestions and feedback directly to the team.">
  <meta name="twitter:image" content="https://www.local-share.com/og-image.jpg">

  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <h1>LocalShare Suggestions</h1>
    <p>We’d love to hear your ideas to improve LocalShare! Submit your suggestion below.</p>
    <form id="suggestionForm" method="POST">
      <label for="suggestion">Your Suggestion:</label><br>
      <textarea id="suggestion" name="suggestion" rows="5" placeholder="Type your suggestion here..." required></textarea><br>
      <button type="submit">Submit Suggestion</button>
    </form>
    <p><a href="/index.html">Back to LocalShare</a></p>
  </div>
  <script>
    document.getElementById('suggestionForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const formData = new FormData(this);
      const suggestion = formData.get('suggestion');

      fetch('/submit-suggestion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ suggestion })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert('Error: ' + data.error);
        } else {
          alert('Thank you for your suggestion! Returning to the main page.');
          window.location.href = '/index.html';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('An error occurred. Please try again later.');
      });
    });
  </script>
</body>
</html>
